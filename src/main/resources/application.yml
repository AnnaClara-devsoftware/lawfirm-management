app:
  storage:
    documents-dir: ${DOCUMENTS_DIR:./storage/documents}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 2MB
  application:
    name: lawfirm-management
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lawfirm_db}${DB_PARAMS:}
    username: ${DB_USER:lawfirm_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-minimum-256-bits-required}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

bootstrap:
  admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    name: ${BOOTSTRAP_ADMIN_NAME:Administrador}
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@lawfirm.local}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.lawfirm.management: INFO
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
