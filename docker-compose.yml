services:
  postgres:
    image: postgres:16-alpine
    container_name: lawfirm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lawfirm_db}
      POSTGRES_USER: ${DB_USER:-lawfirm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lawfirm_user} -d ${DB_NAME:-lawfirm_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: lawfirm-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-lawfirm_db}
      DB_USER: ${DB_USER:-lawfirm_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production-minimum-256-bits-required}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      DOCUMENTS_DIR: /app/storage/documents
    volumes:
      - documents_data:/app/storage/documents
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  postgres_data:

  documents_data:
